name: CI
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      HF_HOME: ~/.cache/hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hf
          key: hf-${{ hashFiles('agent/config.yaml') }}
      - run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - name: Repo rules (no secrets, gigsim untouched, prompts in agent/prompts, cited numbers)
        run: python scripts/check_repo_rules.py
      - run: ruff check agent rag mcp_servers apps/api evals worker
      - name: Unit, integration and MCP tests
        run: pytest -q --ignore=tests/contract
      - name: Contract tests (MCP tool-schema snapshot)
        run: pytest -q tests/contract

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose file
        run: cp .env.example .env && sed -i 's/=$/=ci-placeholder/' .env && docker compose -f infra/docker-compose.yml --env-file .env config -q
