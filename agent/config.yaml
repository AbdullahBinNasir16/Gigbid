# GigBid runtime configuration.
# Every model, threshold, budget, fee and platform rule lives here, never in Python.
# Env overrides: MODEL_PROFILE -> models.profile, MARKETPLACE_MODE -> marketplace.mode.

marketplace:
  mode: gigsim                     # gigsim | upwork_live | fake  (kit key, kept)
  max_requests_per_minute: 20      # kit key, kept. Our own limiter stays under GigSim's limit.
  polling_interval_seconds: 300    # scheduled scouting in gigsim mode
  live_polling_interval_seconds: 1800  # conservative schedule for the official Upwork server
  adapters:                        # mode -> "module:Class". Graph code never imports these.
    fake: mcp_servers.marketplace.adapters.fake:FakeMarketplace
    gigsim: mcp_servers.marketplace.adapters.gigsim:GigSimMarketplace
    upwork_live: mcp_servers.marketplace.adapters.upwork_live:UpworkLiveMarketplace
  request_timeout_seconds: 10
  retry:
    max_attempts: 3
    base_delay_seconds: 0.5
    max_delay_seconds: 8
  circuit_breaker:
    failure_threshold: 5
    cooldown_seconds: 30

models:
  profile: open                    # kit key, kept. open is required, paid is optional.
  providers:                       # provider -> how to reach it. Secrets come from env only.
    ollama:
      kind: openai_compatible
      base_url_env: OLLAMA_BASE_URL
      default_base_url: http://localhost:11434/v1
      api_key_env: null
    hosted_open:                   # Groq, OpenRouter or Together (open weight models only)
      kind: openai_compatible
      base_url_env: OPEN_MODEL_BASE_URL
      default_base_url: https://api.groq.com/openai/v1
      api_key_env: OPEN_MODEL_API_KEY
    paid:
      kind: openai_compatible
      base_url_env: PAID_MODEL_BASE_URL
      default_base_url: https://api.openai.com/v1
      api_key_env: PAID_MODEL_API_KEY

  # Small models for cheap, frequent nodes. Strongest model for writer and critic.
  # open runs on a laptop CPU (tested machine: 8 cores, 2 GB GPU): qwen2.5 3b and 7b via a local
  # model server. Pull first: `ollama pull qwen2.5:3b qwen2.5:7b qwen2.5:1.5b`.
  # For full eval runs use open_hosted (same open weight families, hosted, much faster).
  profiles:
    open:
      scout:             {provider: ollama, model: "qwen2.5:3b", temperature: 0.0, max_tokens: 1024}
      analyst:           {provider: ollama, model: "qwen2.5:7b", temperature: 0.0, max_tokens: 2048}
      risk:              {provider: ollama, model: "qwen2.5:3b", temperature: 0.0, max_tokens: 1024}
      matcher:           {provider: ollama, model: "qwen2.5:7b", temperature: 0.0, max_tokens: 2048}
      pricing:           {provider: ollama, model: "qwen2.5:7b", temperature: 0.0, max_tokens: 1024}
      writer:            {provider: ollama, model: "qwen2.5:7b", temperature: 0.4, max_tokens: 2048}
      verifier:          {provider: ollama, model: "qwen2.5:7b", temperature: 0.0, max_tokens: 2048}
      critic:            {provider: ollama, model: "qwen2.5:7b", temperature: 0.0, max_tokens: 1536}
      compliance:        {provider: ollama, model: "qwen2.5:3b", temperature: 0.0, max_tokens: 1024}
      liaison:           {provider: ollama, model: "qwen2.5:7b", temperature: 0.3, max_tokens: 1536}
      intent_classifier: {provider: ollama, model: "qwen2.5:3b", temperature: 0.0, max_tokens: 256}
    paid:
      scout:             {provider: paid, model: "gpt-5-mini", temperature: 0.0, max_tokens: 1024}
      analyst:           {provider: paid, model: "gpt-5-mini", temperature: 0.0, max_tokens: 2048}
      risk:              {provider: paid, model: "gpt-5-mini", temperature: 0.0, max_tokens: 1024}
      matcher:           {provider: paid, model: "gpt-5-mini", temperature: 0.0, max_tokens: 2048}
      pricing:           {provider: paid, model: "gpt-5-mini", temperature: 0.0, max_tokens: 1024}
      writer:            {provider: paid, model: "gpt-5",      temperature: 0.4, max_tokens: 2048}
      verifier:          {provider: paid, model: "gpt-5-mini", temperature: 0.0, max_tokens: 2048}
      critic:            {provider: paid, model: "gpt-5",      temperature: 0.0, max_tokens: 1536}
      compliance:        {provider: paid, model: "gpt-5-mini", temperature: 0.0, max_tokens: 1024}
      liaison:           {provider: paid, model: "gpt-5-mini", temperature: 0.3, max_tokens: 1536}
      intent_classifier: {provider: paid, model: "gpt-5-mini", temperature: 0.0, max_tokens: 256}
    # Deployed profile: open weight models on a hosted provider (free hosts have no GPU).
    open_hosted:
      scout:             {provider: hosted_open, model: "llama-3.1-8b-instant",    temperature: 0.0, max_tokens: 1024}
      analyst:           {provider: hosted_open, model: "llama-3.1-8b-instant",    temperature: 0.0, max_tokens: 2048}
      risk:              {provider: hosted_open, model: "llama-3.1-8b-instant",    temperature: 0.0, max_tokens: 1024}
      matcher:           {provider: hosted_open, model: "llama-3.3-70b-versatile", temperature: 0.0, max_tokens: 2048}
      pricing:           {provider: hosted_open, model: "llama-3.1-8b-instant",    temperature: 0.0, max_tokens: 1024}
      writer:            {provider: hosted_open, model: "llama-3.3-70b-versatile", temperature: 0.4, max_tokens: 2048}
      verifier:          {provider: hosted_open, model: "llama-3.3-70b-versatile", temperature: 0.0, max_tokens: 2048}
      critic:            {provider: hosted_open, model: "llama-3.3-70b-versatile", temperature: 0.0, max_tokens: 1536}
      compliance:        {provider: hosted_open, model: "llama-3.1-8b-instant",    temperature: 0.0, max_tokens: 1024}
      liaison:           {provider: hosted_open, model: "llama-3.1-8b-instant",    temperature: 0.3, max_tokens: 1536}
      intent_classifier: {provider: hosted_open, model: "llama-3.1-8b-instant",    temperature: 0.0, max_tokens: 256}

  # Used when the primary model of a cheap node fails or times out.
  fallback_models:
    open:
      scout:             {provider: ollama, model: "qwen2.5:1.5b", temperature: 0.0, max_tokens: 1024}
      risk:              {provider: ollama, model: "qwen2.5:1.5b", temperature: 0.0, max_tokens: 1024}
      compliance:        {provider: ollama, model: "qwen2.5:1.5b", temperature: 0.0, max_tokens: 1024}
      intent_classifier: {provider: ollama, model: "qwen2.5:1.5b", temperature: 0.0, max_tokens: 256}
    open_hosted:
      scout:             {provider: hosted_open, model: "gemma2-9b-it", temperature: 0.0, max_tokens: 1024}
      risk:              {provider: hosted_open, model: "gemma2-9b-it", temperature: 0.0, max_tokens: 1024}
      compliance:        {provider: hosted_open, model: "gemma2-9b-it", temperature: 0.0, max_tokens: 1024}
      intent_classifier: {provider: hosted_open, model: "gemma2-9b-it", temperature: 0.0, max_tokens: 256}
    paid: {}

  # Open models in every profile, CPU friendly.
  # Chosen by measurement on this CPU (evals/results/rag_*.json): small models keep a
  # full dev-set retrieval run under a few minutes. Swap to nomic or bge-reranker-v2-m3 here.
  embeddings:
    model: BAAI/bge-small-en-v1.5
    dimension: 384
    query_prefix: "Represent this sentence for searching relevant passages: "
    document_prefix: ""
  reranker:
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    top_n: 20                      # rerank only the top 20 candidates on CPU

budgets:
  max_graph_steps: 30              # kit key, kept (alias of max_steps_per_thread)
  max_revisions: 2                 # kit key, kept (alias of critic_max_loops)
  max_tokens_per_job: 12000        # kit key, kept (alias of max_tokens_per_thread)
  max_steps_per_thread: 30
  max_tokens_per_thread: 12000
  critic_max_loops: 2
  node_timeout_seconds: 60
  node_max_retries: 2
  p95_latency_seconds:
    job_analysed: 20
    proposal: 90
  cost_usd:
    job_analysed: 0.002
    proposal: 0.02

thresholds:
  minimum_fit_score: 0.60          # kit key, kept (bid cutoff)
  maximum_risk_score: 0.70         # kit key, kept (scam cutoff)
  fit:
    bid: 0.50                      # fit >= bid and risk < scam -> bid (tuned on dev set)
    watch: 0.35                    # watch <= fit < bid -> watch
  scam_risk: 0.70                  # risk >= this -> skip
  price:
    floor_hourly_usd: 25           # never quote under the user's floor
    floor_fixed_usd: 100
    band_low_percentile: p25
    band_high_percentile: p75
    min_expected_value_per_connect_usd: 1.0   # worth_it rule for Connects spend
  autonomy:
    auto_skip_below_fit: 0.25
  # skip when the client's top budget is below these fractions of the user's floor
  below_floor_hourly_ratio: 0.8
  below_floor_fixed_ratio: 0.5      # used only when the user enables auto skip. Never auto sends.

platform_rules:
  connects:
    cost_per_proposal: 6
    cost_by_budget_usd:            # optional tiers; the highest matching tier wins
      - {min_budget: 0,    cost: 4}
      - {min_budget: 500,  cost: 6}
      - {min_budget: 2000, cost: 10}
    weekly_budget: 80
  fees:
    service_fee_percent: 10
  policy_pack_dir: data/policy_pack
  banned_phrases_file: data/policy_pack/banned_phrases.txt
  off_platform_terms:
    - whatsapp
    - telegram
    - skype
    - pay outside
    - paypal me
    - wire transfer
    - western union

memory:
  style:
    min_edits_to_promote: 3        # an edit pattern must appear in N distinct proposals
    max_items: 50
  outcome:
    min_samples_to_promote: 10     # per job category
    min_reply_rate_delta: 0.05

tool_allowlists:
  scout:      [search_jobs, get_job, get_client_history, get_connects_balance]
  risk:       [get_job, get_client_history]
  pricing:    [get_job, get_client_history, get_connects_balance]
  matcher:    [search_evidence, get_case_study, list_skills]
  writer:     [search_evidence, get_case_study, list_skills]
  critic:     [search_evidence, get_case_study, list_skills]
  analyst:    []
  compliance: []
  liaison:
    read: [list_messages, get_client_history, get_free_slots]
    after_approval: [send_message, create_tentative_hold, create_email_draft]
  submitter:  [get_connects_balance, create_proposal_draft, submit_proposal]

retrieval:
  variant: v0_naive                # v0_naive | v1_decomposition | v2_hybrid | v3_rerank | v4_outcome_aware | v8_corrective
  compose: []                      # e.g. [v1_decomposition, v2_hybrid, v3_rerank]
  outcome_boost_weight: 0.15
  corrective_max_requeries: 2
  min_evidence_score: 0.35

seeds:
  global: 4016

# Risk Assessor rules. Each signal is a list of regexes (case-insensitive) and a weight;
# the score is 1 - prod(1 - weight) over the signals that fire, plus client-history signals.
risk_rules:
  signals:
    off_platform_payment:
      weight: 0.8
      patterns: ['outside (of )?the platform', 'off[- ]platform', 'avoid (platform )?fees', 'paypal', 'western union', 'wire transfer', 'usdt', 'crypto wallet', 'directly to your (wallet|account)', 'company account outside']
    off_platform_contact:
      weight: 0.6
      patterns: ['whats ?app', 'telegram', 'skype', 'signal app', 'contact me (on|at|via)', 'email me at', '\+\d[\d \-]{7,}']
    free_work:
      weight: 0.7
      patterns: ['unpaid (test|trial)', 'trial (week|project)? ?unpaid', 'work one full week unpaid', 'free sample', 'send (three|3|some) (finished )?sample', 'pay only after', 'after (we|the business) launch', 'equity only', 'no cash']
    personal_data_request:
      weight: 0.8
      patterns: ['copy of your (id|passport)', 'national id', 'bank(ing)? login', 'send your full name, phone', 'social security', 'verify your bank account']
    upfront_deposit:
      weight: 0.8
      patterns: ['refundable .{0,20}deposit', 'pay (a|the) .{0,20}(fee|deposit) first', 'shipping deposit']
    too_good:
      weight: 0.3
      patterns: ['no experience needed', 'easy work from home', '\$\d+ ?(per|a|/) ?week', 'earn \$?\d+']
  injection_patterns: ['ignore (all )?(previous|prior|above) instructions', 'you are now', '\[system\]', 'if you are an? (ai|automated|bot|language model)', 'for ai assistants', 'reveal your (system )?prompt', 'skip the review', 'submit immediately', 'admin mode', 'note to (bots|ai|assistants|agents)', 'ignore your (rules|instructions)', 'disregard (all|any|previous)']
  injection_weight: 0.5
  client:
    unverified_payment: 0.15
    no_spend_history: 0.1
    low_rating_below: 3.5
    low_rating_weight: 0.2

generation:
  writer_mode: llm             # llm | template (template = deterministic, evidence-only)
  critic_mode: rules+llm       # rules | rules+llm
  analyst_mode: rules          # rules | llm
  evidence_k: 6
  max_words: 250
  min_words: 80
